<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4a82b8">
    <title>You are offline | All In One Solution</title>
    <style>
      body {
        align-items: center;
        background: #f8fafc;
        color: #1e293b;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 1.5rem;
        text-align: center;
      }
      main { max-width: 32rem; }
      h1 { color: #315e88; }
      button {
        background: #4a82b8;
        border: 0;
        border-radius: 0.5rem;
        color: white;
        cursor: pointer;
        font-size: 1rem;
        padding: 0.75rem 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to the internet to continue using All In One Solution.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
